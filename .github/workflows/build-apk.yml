name: Build ProFaceSwap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare AI models directory
        run: |
          mkdir -p app/src/main/assets/models

      - name: Download 478-point Face Landmarker
        run: |
          wget -O app/src/main/assets/models/face_landmarker_Nx3x256x256.onnx \
            https://github.com/yakhyo/mediapipe-face-mesh-onnx/releases/download/weights/face_landmarker_Nx3x256x256.onnx

      - name: Download BlazeFace detector
        run: |
          wget -O app/src/main/assets/models/face_detection_short_range.onnx \
            https://github.com/yakhyo/mediapipe-face-mesh-onnx/releases/download/weights/face_detection_short_range.onnx

      - name: Download ArcFace embedding model
        run: |
          wget -O app/src/main/assets/models/arcface_w600k_r50.onnx \
            https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/arcface_w600k_r50.onnx

      - name: Download HyperSwap 1a 256
        run: |
          wget -O app/src/main/assets/models/hyperswap_1a_256.onnx \
            https://huggingface.co/facefusion/models-3.3.0/resolve/main/hyperswap_1a_256.onnx

      - name: Verify AI models
        run: |
          echo "Downloaded AI models:"
          ls -lh app/src/main/assets/models/

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProFaceSwap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
