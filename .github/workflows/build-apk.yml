name: Build ProFaceSwap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download BlendSwap 256
        run: |
          mkdir -p app/src/main/assets/models

          wget -O app/src/main/assets/models/blendswap_256.onnx \
            https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/blendswap_256.onnx

          ls -lh app/src/main/assets/models/

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProFaceSwap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
